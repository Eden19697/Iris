<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Iris</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --sub:#6e6e73; --line:#d2d2d7; --accent:#0a84ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1c1e; --card:#2c2c2e; --text:#f5f5f7; --sub:#98989d; --line:#3a3a3c; --accent:#0a84ff; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "PingFang SC", sans-serif;
         display: flex; align-items: center; justify-content: center; overflow: auto; }
  main { width: min(720px, 92vw); padding: 32px 0; }
  header { text-align: center; margin-bottom: 28px; }
  header img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { margin: 12px 0 2px; font-size: 28px; letter-spacing: .08em; }
  header p { margin: 0; color: var(--sub); }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
  button.card { text-align: left; background: var(--card); color: var(--text); border: 1px solid var(--line);
         border-radius: 14px; padding: 22px; cursor: pointer; font: inherit; transition: transform .12s, border-color .12s; }
  button.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  button.card:disabled { opacity: .6; cursor: progress; }
  .card .ic { font-size: 30px; line-height: 1; }
  .card h2 { margin: 12px 0 6px; font-size: 17px; }
  .card p { margin: 0; color: var(--sub); font-size: 13.5px; }
  .recent { margin-top: 30px; }
  .recent h3 { margin: 0 0 8px; font-size: 13px; color: var(--sub); font-weight: 600; letter-spacing: .05em; }
  .recent ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .recent li { padding: 10px 16px; cursor: pointer; display: flex; gap: 12px; align-items: baseline; border-top: 1px solid var(--line); }
  .recent li:first-child { border-top: 0; }
  .recent li:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .recent li.gone { opacity: .45; }
  .recent .n { font-weight: 600; white-space: nowrap; }
  .recent .d { color: var(--sub); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; flex: 1; }
  .hint { margin-top: 18px; text-align: center; color: var(--sub); font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="home_icon.png" alt="">
    <h1>Iris</h1>
    <p>Markdown / HTML 阅读器</p>
  </header>
  <div class="cards">
    <button class="card" id="open">
      <div class="ic">📄</div>
      <h2>直接打开文件</h2>
      <p>打开 .md、.html、.txt 或已经做好的 .mdz 图文包。</p>
    </button>
    <button class="card" id="bundle">
      <div class="ic">🗂️</div>
      <h2>合成图文包并打开</h2>
      <p>选择 .md 文件和它的图片文件夹,合成一个 .mdz 保存在本地,并立刻打开。下次直接打开这个 .mdz 即可。</p>
    </button>
  </div>
  <section class="recent" id="recentBox" hidden>
    <h3>最近打开</h3>
    <ul id="recent"></ul>
  </section>
  <div class="hint">也可以直接把文件拖到 Iris 图标上,或在 Finder 里双击 .md / .mdz。</div>
</main>
<script>
// 原生桥:把按钮操作交给 Swift;最近文件由 Swift 在页面加载后通过 setRecent 推送
const post = m => webkit.messageHandlers.native.postMessage(m);
const iris = {
  openFile: async () => post({cmd: 'home:open'}),
  makeBundle: async () => post({cmd: 'home:bundle'}),
  openRecent: async p => post({cmd: 'home:recent', path: p}),
  recent: async () => window.__recent || [],
};
window.setRecent = list => { window.__recent = list; refresh() };
const $ = s => document.querySelector(s);
const busy = on => document.querySelectorAll('button.card').forEach(b => b.disabled = on);
$('#open').onclick = async () => { busy(true); try { await iris.openFile() } finally { busy(false) } };
$('#bundle').onclick = async () => { busy(true); try { await iris.makeBundle() } finally { busy(false) } };
async function refresh() {
  const list = await iris.recent();
  $('#recentBox').hidden = !list.length;
  const ul = $('#recent'); ul.textContent = '';
  for (const r of list) {
    const li = document.createElement('li');
    if (!r.exists) li.className = 'gone';
    const n = document.createElement('span'); n.className = 'n'; n.textContent = r.name;
    const d = document.createElement('span'); d.className = 'd'; d.textContent = r.dir; d.title = r.path;
    li.append(n, d);
    li.onclick = () => iris.openRecent(r.path);
    ul.append(li);
  }
}
</script>
</body>
</html>
